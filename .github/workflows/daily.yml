name: Daily buy candidates

on:
  # Descheduled 2026-07-20 to reserve Anthropic API quota for the family
  # expense planner. Uncomment the block below to resume daily runs.
  # schedule:
  #   # 21:30 UTC = 22:30 CET (winter) / 23:30 CEST (summer).
  #   # Always after US market close (22:00 Berlin).
  #   - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: uv run python -m buy_candidates.main

      - name: Commit dashboard + archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ archive/
          if ! git diff --quiet --cached; then
            git commit -m "Daily update $(date -u +'%Y-%m-%d')"
            git push
          fi
